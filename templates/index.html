<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STREAM CORPORATION • ADMIN</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0a0a;
  --glass: rgba(20, 20, 25, 0.75);
  --glass-border: rgba(255,255,255,0.12);
  --red:#ef4444;
  --red2:#dc2626;
  --white:#ffffff;
  --light:#f1f5f9;
  --muted:#a3b4d0;
}

* { margin:0; padding:0; box-sizing:border-box; }

body {
  background: var(--bg);
  color: var(--light);
  font-family: 'Syne', sans-serif;
  min-height: 100vh;
  overflow-x: hidden;
  position: relative;
}

/* Background */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image: 
    linear-gradient(rgba(239,68,68,0.05) 1px, transparent 1px),
    linear-gradient(90deg, rgba(239,68,68,0.05) 1px, transparent 1px);
  background-size: 70px 70px;
  pointer-events: none;
  z-index: 0;
}
body::after {
  content: '';
  position: fixed;
  top: -400px; left: -400px;
  width: 1000px; height: 1000px;
  background: radial-gradient(circle, rgba(239,68,68,0.25) 0%, transparent 65%);
  pointer-events: none;
  z-index: 0;
}

/* Header */
.header {
  border-bottom: 1px solid rgba(239,68,68,0.4);
  padding: 20px 30px;
  display: flex;
  align-items: center;
  justify-content: center;
  position: sticky; top: 0; z-index: 100;
  background: rgba(10,10,10,0.9);
  backdrop-filter: blur(24px);
  box-shadow: 0 10px 40px rgba(0,0,0,0.6);
}
.logo {
  font-size: 2.1rem;
  font-weight: 800;
  letter-spacing: -2.2px;
  display: flex;
  align-items: center;
  gap: 16px;
  color: var(--white);
  text-shadow: 0 0 25px var(--red);
}
.logo-icon {
  width: 56px; height: 56px;
  background: linear-gradient(135deg, var(--red), #b91c1c);
  border-radius: 16px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.9rem;
  box-shadow: 0 0 45px rgba(239,68,68,0.6);
  border: 2px solid rgba(255,255,255,0.3);
}

/* Glass Cards */
.card {
  background: var(--glass);
  border: 1px solid var(--glass-border);
  border-radius: 22px;
  padding: 32px;
  margin-bottom: 26px;
  backdrop-filter: blur(20px);
  box-shadow: 0 15px 45px rgba(0,0,0,0.5);
  transition: all 0.4s ease;
}
.card:hover {
  border-color: var(--red);
  transform: translateY(-8px);
  box-shadow: 0 25px 60px rgba(239,68,68,0.3);
}

/* Auth Section */
#auth-gate {
  max-width: 490px;
  margin: 110px auto;
  text-align: center;
}
.auth-logo-big {
  width: 100px; height: 100px;
  background: linear-gradient(135deg, var(--red), #b91c1c);
  border-radius: 26px;
  margin: 0 auto 30px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 3rem;
  box-shadow: 0 25px 70px rgba(239,68,68,0.5);
  border: 3px solid rgba(255,255,255,0.2);
}
#auth-gate h1 {
  font-size: 3rem;
  font-weight: 800;
  letter-spacing: -2.5px;
  background: linear-gradient(90deg, var(--white), #ff9999, var(--red));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  margin-bottom: 10px;
}
#auth-gate p {
  color: var(--muted);
  font-size: 1.25rem;
}

/* Tabs */
.tab-switcher {
  display: flex;
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 16px;
  padding: 6px;
  margin-bottom: 28px;
}
.tab-btn {
  flex: 1;
  padding: 14px;
  border: none;
  background: transparent;
  color: var(--white);
  font-weight: 700;
  border-radius: 12px;
  cursor: pointer;
  transition: all 0.3s;
}
.tab-btn.active {
  background: var(--red);
  color: var(--white);
  box-shadow: 0 5px 20px rgba(239,68,68,0.5);
}

/* Inputs & Buttons */
input, select {
  width: 100%;
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.15);
  border-radius: 14px;
  padding: 16px 18px;
  color: var(--white);
  font-family: 'Space Mono', monospace;
  margin-bottom: 16px;
  font-size: 1rem;
}
input:focus, select:focus {
  border-color: var(--red);
  box-shadow: 0 0 0 4px rgba(239,68,68,0.3);
  background: rgba(239,68,68,0.1);
}

.btn-primary {
  background: linear-gradient(135deg, var(--red), var(--red2));
  color: white;
  padding: 16px;
  width: 100%;
  font-size: 1.1rem;
  font-weight: 700;
  border-radius: 14px;
  box-shadow: 0 10px 35px rgba(239,68,68,0.4);
}
.btn-primary:hover { transform: translateY(-4px); box-shadow: 0 18px 45px rgba(239,68,68,0.55); }

.btn-blue {
  background: linear-gradient(135deg, #3b82f6, #1e40af);
  color: white;
}

/* Stats, Table, Toast, Modal - Same glassy style with high visibility */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 22px; margin-bottom: 32px; }
.stat-box {
  background: var(--glass);
  border: 1px solid var(--glass-border);
  border-radius: 18px;
  padding: 28px;
  text-align: center;
  backdrop-filter: blur(16px);
}
.stat-num { font-size: 3rem; font-weight: 800; }
.s-red .stat-num { color: var(--red); }
.s-green .stat-num { color: #4ade80; }

.table-wrap {
  background: var(--glass);
  border: 1px solid var(--glass-border);
  border-radius: 18px;
  overflow: hidden;
  backdrop-filter: blur(16px);
}
th { background: rgba(239,68,68,0.15); color: var(--red); padding: 18px 22px; text-transform: uppercase; font-size: 0.75rem; }
td { padding: 18px 22px; border-top: 1px solid rgba(255,255,255,0.08); color: var(--light); }
tr:hover td { background: rgba(239,68,68,0.12); }

.toast, .modal {
  background: var(--glass);
  backdrop-filter: blur(20px);
  border: 1px solid var(--red);
  color: var(--white);
}
</style>
</head>
<body>

<div class="header">
  <div class="logo">
    <div class="logo-icon">⚡</div>
    STREAM CORPORATION
  </div>
</div>

<div class="container">

  <!-- AUTH GATE -->
  <div id="auth-gate">
    <div class="auth-logo-big">🔐</div>
    <h1>ADMIN PANEL</h1>
    <p>STREAM CORPORATION CONTROL CENTER</p>

    <div class="card">
      <div class="tab-switcher">
        <button onclick="switchLoginTab(0)" class="tab-btn active">RESELLER</button>
        <button onclick="switchLoginTab(1)" class="tab-btn">MAIN ADMIN</button>
      </div>

      <div id="login-sub">
        <input type="text" id="sub-user" placeholder="Username">
        <input type="password" id="sub-pass" placeholder="Password">
        <button class="btn-blue" onclick="doSubLogin()">LOGIN AS RESELLER</button>
      </div>

      <div id="login-main" style="display:none;">
        <input type="password" id="main-key" placeholder="Secret Admin Key">
        <button class="btn-primary" onclick="doMainLogin()">ACCESS MAIN PANEL</button>
      </div>
    </div>
  </div>

  <!-- MAIN PANEL & SUB PANEL will go here when you expand -->

</div>

<div class="toast" id="toast"></div>

<script>
// ==================== YOUR ORIGINAL FULL JAVASCRIPT ====================
let SESSION = {role:null,adminKey:null,username:null,password:null};
let allMainUIDs=[], allSubUIDs=[];
let pendingUID=null, pendingIsMain=false;

// ... (Paste all your original script functions here: doMainLogin, doSubLogin, loadUIDs, tables, etc.)

function switchLoginTab(n) {
  document.getElementById('login-sub').style.display = n === 0 ? 'block' : 'none';
  document.getElementById('login-main').style.display = n === 1 ? 'block' : 'none';
  
  const tabs = document.querySelectorAll('.tab-btn');
  tabs.forEach((tab, i) => tab.classList.toggle('active', i === n));
}

function showToast(msg, type = 'success') {
  const t = document.getElementById('toast');
  t.textContent = type === 'success' ? '✓ ' + msg : '✗ ' + msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3200);
}
</script>
</body>
</html>
