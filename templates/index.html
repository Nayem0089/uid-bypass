<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>STREAM CORP | Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #040408;
      font-family: 'Inter', sans-serif;
      color: #f4f6ff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(ellipse at 50% 0%, rgba(239,68,68,0.08) 0%, transparent 70%);
      padding: 20px;
    }

    /* Particle Canvas */
    #particle-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
      opacity: 0.6;
    }

    /* Login Box */
    .login-container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 440px;
    }

    .login-box {
      background: rgba(8, 8, 16, 0.92);
      border: 1px solid rgba(239,68,68,0.22);
      border-radius: 32px;
      padding: 44px 38px 38px;
      box-shadow: 0 0 80px rgba(239,68,68,0.08), 0 0 0 1px rgba(255,255,255,0.04) inset, 0 8px 32px rgba(0,0,0,0.5);
      position: relative;
      overflow: hidden;
      backdrop-filter: blur(20px);
    }

    .login-box::before {
      content: '';
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 60%;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(239,68,68,0.6), transparent);
    }

    /* Logo */
    .login-logo {
      width: 72px;
      height: 72px;
      background: radial-gradient(circle at 35% 35%, rgba(239,68,68,0.3), rgba(0,0,0,0.2));
      border-radius: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      font-weight: 900;
      margin: 0 auto 20px;
      border: 1px solid rgba(239,68,68,0.45);
      box-shadow: 0 0 28px rgba(239,68,68,0.28), 0 0 60px rgba(239,68,68,0.1);
      animation: logoPulse 3s ease-in-out infinite;
      letter-spacing: -1px;
    }

    @keyframes logoPulse {
      0%, 100% { box-shadow: 0 0 24px rgba(239,68,68,0.28), 0 0 60px rgba(239,68,68,0.1); }
      50% { box-shadow: 0 0 36px rgba(239,68,68,0.45), 0 0 80px rgba(239,68,68,0.18); }
    }

    .login-title {
      font-size: 30px;
      font-weight: 900;
      text-align: center;
      letter-spacing: -0.8px;
      margin-bottom: 2px;
    }

    .login-title .gradient {
      background: linear-gradient(110deg, #fff 0%, #ef4444 45%, #ff9b9b 75%, #fff 100%);
      background-size: 220% auto;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: textShine 4s linear infinite;
    }

    @keyframes textShine {
      0% { background-position: 0% center; }
      100% { background-position: 220% center; }
    }

    .login-subtitle {
      text-align: center;
      font-size: 10px;
      color: #4b5563;
      letter-spacing: 2px;
      margin-bottom: 24px;
      text-transform: uppercase;
      font-family: 'Space Mono', monospace;
    }

    /* Tab Switch */
    .tab-switch {
      display: flex;
      background: rgba(0,0,0,0.5);
      border-radius: 999px;
      padding: 4px;
      margin-bottom: 24px;
      border: 1px solid rgba(255,255,255,0.06);
      gap: 6px;
    }

    .tab-btn {
      flex: 1;
      background: transparent;
      border: none;
      padding: 12px 14px;
      font-weight: 700;
      font-size: 11px;
      letter-spacing: 1px;
      border-radius: 999px;
      color: #9ca3af;
      cursor: pointer;
      transition: all 0.22s;
      text-transform: uppercase;
      font-family: 'Space Mono', monospace;
    }

    .tab-btn.active {
      background: linear-gradient(135deg, #ef4444, #b91c1c);
      color: #fff;
      box-shadow: 0 3px 12px rgba(239,68,68,0.4), 0 0 20px rgba(239,68,68,0.15);
    }

    .tab-btn:hover:not(.active) {
      color: #f4f6ff;
    }

    /* Form */
    .login-form {
      display: block;
    }

    .login-form.hidden {
      display: none;
    }

    .input-group {
      margin-bottom: 14px;
    }

    .input-glow {
      display: block;
      background: rgba(255,255,255,0.03) !important;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px;
      padding: 14px 18px;
      width: 100%;
      color: #f4f6ff;
      transition: all 0.18s;
      font-family: 'Inter', sans-serif;
      font-size: 13.5px;
      outline: none;
    }

    .input-glow::placeholder {
      color: #4b5563;
    }

    .input-glow:focus {
      border-color: rgba(239,68,68,0.5);
      background: rgba(239,68,68,0.04) !important;
      box-shadow: 0 0 0 3px rgba(239,68,68,0.12);
    }

    .btn-login {
      width: 100%;
      background: linear-gradient(135deg, #dc2626, #991b1b);
      border: none;
      padding: 15px 20px;
      border-radius: 999px;
      font-weight: 700;
      font-size: 13px;
      letter-spacing: 0.5px;
      color: #fff;
      cursor: pointer;
      transition: all 0.18s;
      box-shadow: 0 4px 16px rgba(239,68,68,0.3), 0 1px 0 rgba(255,255,255,0.12) inset;
      position: relative;
      overflow: hidden;
      margin-top: 4px;
    }

    .btn-login::after {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.08), transparent);
      transition: left 0.4s;
    }

    .btn-login:hover::after {
      left: 100%;
    }

    .btn-login:hover {
      box-shadow: 0 6px 22px rgba(239,68,68,0.45);
      transform: translateY(-1px);
    }

    .btn-login:active {
      transform: scale(0.985);
    }

    .result-msg {
      min-height: 22px;
      margin-top: 10px;
      font-size: 12px;
      text-align: center;
      font-weight: 600;
      font-family: 'Space Mono', monospace;
    }

    .result-msg.error {
      color: #f87171;
    }

    .result-msg.success {
      color: #4ade80;
    }

    /* Footer */
    .login-footer {
      text-align: center;
      margin-top: 20px;
      font-size: 10px;
      color: #4b5563;
      font-family: 'Space Mono', monospace;
      letter-spacing: 1px;
    }

    .login-footer span {
      color: #ef4444;
    }

    /* Responsive */
    @media (max-width: 480px) {
      .login-box {
        padding: 30px 20px 28px;
      }
      .login-logo {
        width: 60px;
        height: 60px;
        font-size: 22px;
      }
      .login-title {
        font-size: 24px;
      }
      .tab-btn {
        font-size: 10px;
        padding: 10px 12px;
      }
    }
  </style>
</head>
<body>

  <!-- Particle Canvas -->
  <canvas id="particle-canvas"></canvas>

  <!-- Login Container -->
  <div class="login-container">
    <div class="login-box">
      <!-- Logo -->
      <div class="login-logo">SC</div>

      <!-- Title -->
      <h2 class="login-title">STREAM <span class="gradient">CORP</span></h2>
      <p class="login-subtitle">// Admin Portal v6.0</p>

      <!-- Tab Switch -->
      <div class="tab-switch">
        <button class="tab-btn active" id="tab-reseller" onclick="switchTab('reseller')">RESELLER</button>
        <button class="tab-btn" id="tab-master" onclick="switchTab('master')">MASTER ADMIN</button>
      </div>

      <!-- Reseller Login Form -->
      <form id="reseller-form" class="login-form" onsubmit="return false;">
        <div class="input-group">
          <input type="text" id="sub-user" class="input-glow" placeholder="Reseller Username" autocomplete="username">
        </div>
        <div class="input-group">
          <input type="password" id="sub-pass" class="input-glow" placeholder="Password" autocomplete="current-password">
        </div>
        <button type="button" class="btn-login" onclick="doSubLogin()">⟁ ACCESS PANEL</button>
        <div class="result-msg" id="sub-login-err"></div>
      </form>

      <!-- Master Admin Login Form -->
      <form id="master-form" class="login-form hidden" onsubmit="return false;">
        <div class="input-group">
          <input type="password" id="main-key" class="input-glow" placeholder="Master Secret Key" autocomplete="current-password">
        </div>
        <button type="button" class="btn-login" onclick="doMainLogin()">⛊ UNLOCK SYSTEM</button>
        <div class="result-msg" id="main-login-err"></div>
      </form>

      <div class="login-footer">
        <span>●</span> SECURE CONNECTION <span>●</span>
      </div>
    </div>
  </div>

  <script>
    // ─── PARTICLE SYSTEM ───
    (function() {
      const canvas = document.getElementById('particle-canvas');
      const ctx = canvas.getContext('2d');
      let W, H, particles = [],
        mouse = { x: -999, y: -999 };

      function resize() {
        W = canvas.width = window.innerWidth;
        H = canvas.height = window.innerHeight;
      }
      resize();
      window.addEventListener('resize', resize);
      window.addEventListener('mousemove', e => {
        mouse.x = e.clientX;
        mouse.y = e.clientY;
      });

      const COLORS = ['rgba(239,68,68,', 'rgba(59,130,246,', 'rgba(139,92,246,', 'rgba(249,115,22,', 'rgba(34,197,94,'];

      function mkP() {
        return {
          x: Math.random() * W,
          y: Math.random() * H,
          vx: (Math.random() - 0.5) * 0.35,
          vy: (Math.random() - 0.5) * 0.35,
          r: Math.random() * 1.4 + 0.3,
          alpha: Math.random() * 0.45 + 0.08,
          color: COLORS[Math.floor(Math.random() * COLORS.length)],
          pulse: Math.random() * Math.PI * 2,
          pulseSpeed: Math.random() * 0.018 + 0.004
        };
      }

      for (let i = 0; i < 100; i++) particles.push(mkP());

      function draw() {
        ctx.clearRect(0, 0, W, H);

        // Connections
        for (let i = 0; i < particles.length; i++) {
          for (let j = i + 1; j < particles.length; j++) {
            const dx = particles[i].x - particles[j].x,
              dy = particles[i].y - particles[j].y,
              d = Math.sqrt(dx * dx + dy * dy);
            if (d < 90) {
              ctx.beginPath();
              ctx.strokeStyle = `rgba(239,68,68,${0.05 * (1 - d / 90)})`;
              ctx.lineWidth = 0.4;
              ctx.moveTo(particles[i].x, particles[i].y);
              ctx.lineTo(particles[j].x, particles[j].y);
              ctx.stroke();
            }
          }
        }

        // Particles
        particles.forEach(p => {
          p.pulse += p.pulseSpeed;
          const a = p.alpha * (0.7 + 0.3 * Math.sin(p.pulse));

          // Mouse interaction
          const mdx = p.x - mouse.x,
            mdy = p.y - mouse.y,
            md = Math.sqrt(mdx * mdx + mdy * mdy);
          if (md < 100) {
            const f = (100 - md) / 100;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.r * (1 + f * 2.5), 0, Math.PI * 2);
            ctx.fillStyle = p.color + (0.1 * f) + ')';
            ctx.fill();
          }

          // Main glow
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.r * 2.2, 0, Math.PI * 2);
          ctx.fillStyle = p.color + (a * 0.12) + ')';
          ctx.fill();

          // Core
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
          ctx.fillStyle = p.color + a + ')';
          ctx.fill();

          p.x += p.vx;
          if (p.x < 0) p.x = W;
          if (p.x > W) p.x = 0;
          p.y += p.vy;
          if (p.y < 0) p.y = H;
          if (p.y > H) p.y = 0;
        });

        requestAnimationFrame(draw);
      }
      draw();
    })();

    // ─── TAB SWITCH ───
    function switchTab(tab) {
      const resellerBtn = document.getElementById('tab-reseller');
      const masterBtn = document.getElementById('tab-master');
      const resellerForm = document.getElementById('reseller-form');
      const masterForm = document.getElementById('master-form');

      if (tab === 'reseller') {
        resellerBtn.classList.add('active');
        masterBtn.classList.remove('active');
        resellerForm.classList.remove('hidden');
        masterForm.classList.add('hidden');
        // Clear errors
        document.getElementById('sub-login-err').textContent = '';
        document.getElementById('main-login-err').textContent = '';
      } else {
        masterBtn.classList.add('active');
        resellerBtn.classList.remove('active');
        masterForm.classList.remove('hidden');
        resellerForm.classList.add('hidden');
        document.getElementById('sub-login-err').textContent = '';
        document.getElementById('main-login-err').textContent = '';
      }
    }

    // ─── LOGIN FUNCTIONS ───
    function showResult(elId, msg, type) {
      const el = document.getElementById(elId);
      if (!el) return;
      el.textContent = msg;
      el.className = 'result-msg ' + type;
      clearTimeout(el._timeout);
      el._timeout = setTimeout(() => {
        el.textContent = '';
        el.className = 'result-msg';
      }, 3500);
    }

    function doMainLogin() {
      const key = document.getElementById('main-key').value.trim();
      if (!key) {
        return showResult('main-login-err', '✗ Enter Master Key', 'error');
      }

      // Simulate API call
      showResult('main-login-err', '⏳ Verifying...', 'success');

      setTimeout(() => {
        // For demo, accept any key
        if (key.length >= 4) {
          showResult('main-login-err', '✓ Access granted! Redirecting...', 'success');
          setTimeout(() => {
            // Redirect to admin panel (same page with dashboard)
            window.location.href = 'dashboard.html';
          }, 800);
        } else {
          showResult('main-login-err', '✗ Invalid Master Key', 'error');
        }
      }, 600);
    }

    function doSubLogin() {
      const username = document.getElementById('sub-user').value.trim();
      const password = document.getElementById('sub-pass').value.trim();

      if (!username || !password) {
        return showResult('sub-login-err', '✗ Enter credentials', 'error');
      }

      showResult('sub-login-err', '⏳ Authenticating...', 'success');

      setTimeout(() => {
        // Demo: accept any username/password
        if (username.length >= 3 && password.length >= 3) {
          showResult('sub-login-err', '✓ Welcome, ' + username + '! Redirecting...', 'success');
          setTimeout(() => {
            window.location.href = 'dashboard.html';
          }, 800);
        } else {
          showResult('sub-login-err', '✗ Invalid credentials', 'error');
        }
      }, 600);
    }

    // ─── ENTER KEY SUPPORT ───
    document.getElementById('sub-pass').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') doSubLogin();
    });

    document.getElementById('main-key').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') doMainLogin();
    });

    document.getElementById('sub-user').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') document.getElementById('sub-pass').focus();
    });
  </script>

</body>
</html>
