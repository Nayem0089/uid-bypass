<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>User Management</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Arial, sans-serif; background: #0f172a; color: #e2e8f0; min-height: 100vh; padding: 20px; }
    h1 { text-align: center; margin-bottom: 20px; color: #38bdf8; }
    .stats { display: flex; gap: 12px; justify-content: center; margin-bottom: 24px; flex-wrap: wrap; }
    .stat { background: #1e293b; border-radius: 10px; padding: 16px 28px; text-align: center; }
    .stat .num { font-size: 2rem; font-weight: bold; color: #38bdf8; }
    .stat .label { font-size: 0.85rem; color: #94a3b8; }
    .card { background: #1e293b; border-radius: 12px; padding: 20px; max-width: 900px; margin: 0 auto 20px; }
    input, select { background: #0f172a; border: 1px solid #334155; border-radius: 8px; color: #e2e8f0; padding: 10px 14px; width: 100%; margin-bottom: 10px; font-size: 14px; }
    .row { display: flex; gap: 10px; flex-wrap: wrap; }
    .row input, .row select { flex: 1; min-width: 140px; }
    button { background: #38bdf8; color: #0f172a; border: none; border-radius: 8px; padding: 10px 20px; font-weight: bold; cursor: pointer; }
    button:hover { background: #0ea5e9; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th { background: #0f172a; color: #94a3b8; padding: 10px; text-align: left; font-size: 13px; }
    td { padding: 10px; border-bottom: 1px solid #1e293b; font-size: 14px; }
    tr:hover td { background: #1e293b; }
    .badge { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 12px; font-weight: bold; }
    .ACTIVE { background: #14532d; color: #4ade80; }
    .EXPIRED { background: #450a0a; color: #f87171; }
    .actions button { background: none; border: 1px solid #334155; color: #e2e8f0; padding: 5px 12px; margin-right: 4px; border-radius: 6px; font-size: 12px; }
    .actions button:hover { background: #334155; }
    #msg { text-align: center; padding: 8px; border-radius: 8px; display: none; margin-top: 10px; }
    .success { background: #14532d; color: #4ade80; }
    .error { background: #450a0a; color: #f87171; }
    #customDate { display: none; }
  </style>
</head>
<body>
  <h1>👤 User Management</h1>

  <div class="stats" id="stats">
    <div class="stat"><div class="num" id="s-total">—</div><div class="label">Total</div></div>
    <div class="stat"><div class="num" id="s-active">—</div><div class="label">Active</div></div>
    <div class="stat"><div class="num" id="s-expired">—</div><div class="label">Expired</div></div>
  </div>

  <div class="card">
    <h3 style="margin-bottom:14px;color:#38bdf8">➕ Add User</h3>
    <div class="row">
      <input id="uid" placeholder="UID" />
      <input id="name" placeholder="Name" />
      <select id="duration" onchange="toggleCustom()">
        <option value="1_month">1 Month</option>
        <option value="3_month">3 Months</option>
        <option value="lifetime">Lifetime</option>
        <option value="custom">Custom Date</option>
      </select>
      <input type="date" id="customDate" />
    </div>
    <button onclick="addUser()">Add User</button>
    <div id="msg"></div>
  </div>

  <div class="card">
    <div style="display:flex;gap:10px;margin-bottom:14px">
      <input id="search" placeholder="🔍 Search by UID or Name…" oninput="loadUsers()" style="margin:0" />
    </div>
    <table>
      <thead><tr><th>#</th><th>UID</th><th>Name</th><th>Expiry</th><th>Status</th><th>Actions</th></tr></thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>

  <script>
    async function loadUsers() {
      const q = document.getElementById('search').value;
      const res = await fetch('/api/users?search=' + encodeURIComponent(q));
      const data = await res.json();
      document.getElementById('s-total').textContent = data.stats.total;
      document.getElementById('s-active').textContent = data.stats.active;
      document.getElementById('s-expired').textContent = data.stats.expired;
      const tbody = document.getElementById('tbody');
      tbody.innerHTML = data.users.map((u, i) => `
        <tr>
          <td>${i+1}</td>
          <td>${u.uid}</td>
          <td>${u.name}</td>
          <td>${u.expiry_date}</td>
          <td><span class="badge ${u.status}">${u.status}</span></td>
          <td class="actions">
            <button onclick="updateUser('${u.uid}')">🔄 Renew</button>
            <button onclick="deleteUser('${u.uid}')" style="color:#f87171;border-color:#7f1d1d">🗑 Delete</button>
          </td>
        </tr>`).join('');
    }

    function toggleCustom() {
      const v = document.getElementById('duration').value;
      document.getElementById('customDate').style.display = v === 'custom' ? 'block' : 'none';
    }

    function showMsg(text, type) {
      const el = document.getElementById('msg');
      el.textContent = text; el.className = type; el.style.display = 'block';
      setTimeout(() => el.style.display = 'none', 3000);
    }

    async function addUser() {
      const uid = document.getElementById('uid').value;
      const name = document.getElementById('name').value;
      const duration = document.getElementById('duration').value;
      const custom_date = document.getElementById('customDate').value;
      const res = await fetch('/api/users', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({uid, name, duration, custom_date})
      });
      const data = await res.json();
      if (data.success) { showMsg('✅ ' + data.message, 'success'); loadUsers(); document.getElementById('uid').value=''; document.getElementById('name').value=''; }
      else showMsg('❌ ' + data.error, 'error');
    }

    async function deleteUser(uid) {
      if (!confirm('Delete user ' + uid + '?')) return;
      const res = await fetch('/api/users/' + uid, {method:'DELETE'});
      const data = await res.json();
      if (data.success) loadUsers();
    }

    async function updateUser(uid) {
      const duration = prompt('Enter duration: 1_month / 3_month / lifetime / custom\nFor custom enter YYYY-MM-DD after comma', '1_month');
      if (!duration) return;
      let d = duration.trim(), custom_date = '';
      if (d.includes(',')) { [d, custom_date] = d.split(',').map(s => s.trim()); d = 'custom'; }
      const res = await fetch('/api/users/' + uid + '/update', {
        method: 'PUT',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({duration: d, custom_date})
      });
      const data = await res.json();
      if (data.success) loadUsers();
    }

    loadUsers();
  </script>
</body>
</html>
