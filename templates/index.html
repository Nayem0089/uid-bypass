<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stream Corporation UID Bypass</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: #0d0f17; color: #e5e7eb; font-family: 'Inter', sans-serif; }
        .glass-card { background: rgba(25, 28, 41, 0.8); border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 12px; }
        .gradient-text { background: linear-gradient(90deg, #22d3ee, #8b5cf6); background-clip: text; -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .btn-gradient { background: linear-gradient(90deg, #06b6d4, #7c3aed); transition: opacity 0.2s; }
        .btn-gradient:hover { opacity: 0.9; }
        .input-dark { background: #151926; border: 1px solid #2d334a; border-radius: 8px; padding: 10px 15px; width: 100%; color: white; outline: none; }
        .input-dark:focus { border-color: #06b6d4; }
        .status-badge { padding: 2px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; }
        .status-active { background: rgba(34, 197, 94, 0.2); color: #22c55e; }
        .status-expired { background: rgba(239, 68, 68, 0.2); color: #ef4444; }
    </style>
</head>
<body class="p-6 md:p-12">

    <!-- Header Section -->
    <div class="flex justify-between items-start mb-8">
        <div>
            <h1 class="text-4xl font-extrabold gradient-text uppercase tracking-wider">Stream Corporation UID Bypass</h1>
           
        </div>
        <div class="flex items-center space-x-3">
            <div class="flex items-center text-sm text-gray-300">
                <span class="w-2 h-2 bg-red-500 rounded-full mr-2 animate-pulse"></span>
                Checking API...
            </div>
            <button class="bg-orange-600 text-xs px-3 py-1 rounded-full font-bold uppercase">Test API</button>
        </div>
    </div>

    <!-- Stats Cards -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
        <div class="glass-card p-6">
            <h3 class="text-gray-400 text-sm font-bold uppercase mb-2">Database</h3>
            <p id="total-users" class="text-5xl font-bold text-cyan-400">0</p>
        </div>
        <div class="glass-card p-6">
            <h3 class="text-gray-400 text-sm font-bold uppercase mb-2">Active</h3>
            <p id="active-users" class="text-5xl font-bold text-green-500">0</p>
        </div>
        <div class="glass-card p-6">
            <h3 class="text-gray-400 text-sm font-bold uppercase mb-2">Expired</h3>
            <p id="expired-users" class="text-5xl font-bold text-red-500">0</p>
        </div>
    </div>

    <!-- Search Bar -->
    <div class="glass-card p-4 flex gap-4 mb-8">
        <input type="text" id="search-input" placeholder="Search UID or Name..." class="input-dark flex-grow">
        <button onclick="fetchUsers()" class="btn-gradient px-6 py-2 rounded-lg font-bold flex items-center">
            <i class="fas fa-search mr-2"></i> SEARCH
        </button>
        <button class="btn-gradient px-6 py-2 rounded-lg font-bold flex items-center">
            <i class="fas fa-sync-alt mr-2"></i> SYNC ALL
        </button>
    </div>

    <!-- Add/Update Section -->
    <div class="glass-card p-8 mb-8">
        <h2 class="text-cyan-400 font-bold mb-6 flex items-center">
            <i class="fas fa-plus mr-2"></i> ADD / UPDATE USER
        </h2>
        
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-6">
            <input type="text" id="uid" placeholder="Enter UID" class="input-dark">
            <input type="text" id="name" placeholder="Enter Name" class="input-dark">
            <input type="date" id="custom_date" class="input-dark">
        </div>

        <div class="flex flex-wrap gap-4 mb-6">
            <button onclick="setDuration('1_month')" class="bg-[#1e2336] px-4 py-2 rounded border border-gray-700 hover:border-cyan-400 transition duration-200">1 MONTH</button>
            <button onclick="setDuration('3_month')" class="bg-[#1e2336] px-4 py-2 rounded border border-gray-700 hover:border-cyan-400 transition duration-200">3 MONTH</button>
            <button onclick="setDuration('lifetime')" class="bg-[#1e2336] px-4 py-2 rounded border border-gray-700 hover:border-cyan-400 transition duration-200">LIFETIME</button>
            <button onclick="setDuration('custom')" class="btn-gradient px-4 py-2 rounded border border-transparent">CUSTOM DATE</button>
        </div>

        <div class="flex items-center mb-6">
            <input type="checkbox" id="sync-api" class="mr-2 accent-cyan-400" checked>
            <label for="sync-api" class="text-sm text-gray-300 font-medium">Sync with Sensix API</label>
        </div>

        <button onclick="saveUser()" class="bg-green-500 hover:bg-green-600 text-black font-extrabold px-8 py-3 rounded-lg flex items-center">
            <i class="fas fa-save mr-2"></i> SAVE CUSTOM
        </button>
    </div>

    <!-- Table Section -->
    <div class="glass-card overflow-hidden">
        <table class="w-full text-left">
            <thead class="bg-[#1e2336] text-gray-400 text-sm uppercase">
                <tr>
                    <th class="p-4">UID</th>
                    <th class="p-4">Name</th>
                    <th class="p-4">Expiry Date</th>
                    <th class="p-4">Status</th>
                    <th class="p-4">Actions</th>
                </tr>
            </thead>
            <tbody id="user-table-body">
                <!-- Rows injected here -->
            </tbody>
        </table>
    </div>

    <script>
        let selectedDuration = 'custom';

        function setDuration(val) {
            selectedDuration = val;
            // Visual feedback could be added here
        }

        async function fetchUsers() {
            const search = document.getElementById('search-input').value;
            const res = await fetch(`/api/users?search=${search}`);
            const data = await res.json();
            
            // Update Stats
            document.getElementById('total-users').innerText = data.stats.total;
            document.getElementById('active-users').innerText = data.stats.active;
            document.getElementById('expired-users').innerText = data.stats.expired;

            const tableBody = document.getElementById('user-table-body');
            tableBody.innerHTML = '';

            data.users.forEach(user => {
                const statusClass = user.status === 'ACTIVE' ? 'status-active' : 'status-expired';
                tableBody.innerHTML += `
                    <tr class="border-b border-gray-800 hover:bg-[#151926] transition">
                        <td class="p-4 font-mono text-cyan-400">${user.uid}</td>
                        <td class="p-4 font-bold">${user.name}</td>
                        <td class="p-4 text-gray-400">${user.expiry_date}</td>
                        <td class="p-4">
                            <span class="status-badge ${statusClass}">${user.status}</span>
                        </td>
                        <td class="p-4">
                            <button onclick="deleteUser('${user.uid}')" class="text-red-500 hover:text-red-400 mx-2">
                                <i class="fas fa-trash"></i>
                            </button>
                        </td>
                    </tr>
                `;
            });
        }

        async function saveUser() {
            const payload = {
                uid: document.getElementById('uid').value,
                name: document.getElementById('name').value,
                duration: selectedDuration,
                custom_date: document.getElementById('custom_date').value
            };

            const res = await fetch('/api/users', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            const result = await res.json();
            if (result.success) {
                alert('User Processed Successfully');
                fetchUsers();
            } else {
                // If UID exists, try update
                if (result.error === "UID already exists") {
                    updateUser(payload);
                } else {
                    alert(result.error);
                }
            }
        }

        async function updateUser(payload) {
            const res = await fetch(`/api/users/${payload.uid}/update`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            const result = await res.json();
            alert(result.message || result.error);
            fetchUsers();
        }

        async function deleteUser(uid) {
            if(confirm('Are you sure?')) {
                await fetch(`/api/users/${uid}`, { method: 'DELETE' });
                fetchUsers();
            }
        }

        // Initial Load
        fetchUsers();
    </script>
</body>
</html>
