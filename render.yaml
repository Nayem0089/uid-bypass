services:
  - type: web
    name: reseller-panel
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 2 --bind 0.0.0.0:$PORT
    envVars:
      - key: SENSIX_BASE
        value: https://new.sensix.shop:2005
      - key: SENSIX_APIKEY
        sync: false
      - key: ADMIN_KEY
        sync: false
      - key: AUTHZEN_SELLER_KEY
        value: libapi_e68f8fdfa38a081b6f174fda9300e1ce968bdfe0

